[project]
name = "draft-intel"
version = "0.1.0"
description = "Draft intelligence for a 10-team 2QB PPR Sleeper auction with keepers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_intel"]

[tool.hatch.build.targets.wheel.force-include]
"src/draft_intel/py.typed" = "draft_intel/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
# Production code is checked under full --strict. Tests are held to a lighter bar:
# fixtures and helpers are deliberately untyped so the assertions stay readable.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/draft_intel"]
# The CLI is a thin hand-driven harness for Sprint 1, exercised via `make replay` and
# `make smoke` rather than unit tests. The logic it calls is covered directly.
omit = ["src/draft_intel/cli.py"]
