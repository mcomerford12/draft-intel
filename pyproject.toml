[project]
name = "draft-intel"
version = "0.1.0"
description = "Draft intelligence for a 10-team 2QB PPR Sleeper auction with keepers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pytest-cov>=7.1.0",
    "pulp>=3.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_intel"]

[tool.hatch.build.targets.wheel.force-include]
"src/draft_intel/py.typed" = "draft_intel/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
# Production code is checked under full --strict. Tests are held to a lighter bar:
# fixtures and helpers are deliberately untyped so the assertions stay readable.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# PuLP ships no type stubs. It is a test-only dependency (ADR-0003's CBC oracle) and is not
# imported anywhere in `src`, so this narrows to the one module rather than relaxing the
# --strict settings that everything else is held to.
module = ["pulp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # PuLP 3.x warns that `LpVariable(...)` is deprecated ahead of its 4.0 API. The CBC oracle
    # (ADR-0003) is deliberately written against the documented 3.x interface; migrating it on
    # PuLP's release schedule is not this project's problem, and it is a test-only dependency.
    # Scoped to the one message so every other DeprecationWarning stays an error.
    "ignore:Constructing LpVariable:DeprecationWarning",
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/draft_intel"]
# The CLI is a thin hand-driven harness for Sprint 1, exercised via `make replay` and
# `make smoke` rather than unit tests. The logic it calls is covered directly.
omit = ["src/draft_intel/cli.py"]
