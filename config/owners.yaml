# Manifest owner name -> the name Sleeper carries for that draft slot.
#
# Slots are resolved live, from draft.metadata.slot_name_{n} where it exists and otherwise
# by joining slot_to_roster_id through /league/{id}/rosters and /league/{id}/users. The real
# league draft object carries NO slot_name_* keys, so the roster/user join is the only path
# that works in production (docs/api-findings.md Finding 9, and DI-EVAL-1 B1).
#
# Sleeper display names, for the five managers who have joined so far. The remaining five
# cannot be mapped until they join the league; manifest_keys(require=20) raises loudly rather
# than silently classifying their keepers as competitive bids.
#
# `Jake: jswilliams5` was confirmed by the commissioner on 2026-09-02, not inferred. The
# display name resembles more than one manifest owner and the account carries no `team_name`,
# so there was nothing in the API to read it off. A wrong mapping here is not a cosmetic error:
# it classifies that team's two keepers as competitive bids, which poisons skew, inflation and
# every tendency profile for the whole draft. Confirm any future mapping the same way.
aliases:
  Me: mattchupiccu
  AJ: ajthebeard
  Mason: MasonWAlpert
  Steve: steeveegee300
  Jake: jswilliams5
  # Unjoined, display names unknown: Connor, Keenan, Willie, Burt, TD.
  # The mock draft used short names, which the join above also covers via slot_name_*.

# Fallback aliases for the mock draft fixture, which carries short slot names.
mock_aliases:
  Me: Matt
