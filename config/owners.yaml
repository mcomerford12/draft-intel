# Manifest owner name -> the name Sleeper carries for that draft slot.
#
# Slots are resolved live, from draft.metadata.slot_name_{n} where it exists and otherwise
# by joining slot_to_roster_id through /league/{id}/rosters and /league/{id}/users. The real
# league draft object carries NO slot_name_* keys, so the roster/user join is the only path
# that works in production (docs/api-findings.md Finding 9, and DI-EVAL-1 B1).
#
# Sleeper display names, for the eight managers who have joined so far. The remaining two
# cannot be mapped until they join the league; manifest_keys(require=20) raises loudly rather
# than silently classifying their keepers as competitive bids.
#
# EVERY MAPPING HERE IS CONFIRMED BY A HUMAN, NEVER INFERRED FROM A RESEMBLANCE. A wrong
# mapping is not a cosmetic error: it classifies that team's two keepers as competitive bids,
# which poisons skew, inflation and every tendency profile for the whole draft. The reverse is
# just as bad -- it hands another manager's keepers to the wrong seat, moving both that seat's
# positional demand and its surplus.
#
#   Jake:   jswilliams5   confirmed by the commissioner, 2026-09-02. The display name
#                         resembles more than one manifest owner and the account carries no
#                         `team_name`, so there was nothing in the API to read it off.
#   Keenan: keenankid17   confirmed by the user, 2026-09-04, on joining at slot 6.
#   Willie: willdeann     confirmed by the user, 2026-09-04, on joining at slot 7.
#   Connor: ConnorRice102 confirmed by the user, 2026-09-04, on joining at slot 8. The resemblance
#                         was obvious and was deliberately NOT acted on until asked -- an obvious
#                         resemblance is exactly the kind that gets a manager's two keepers filed
#                         as competitive bids when it turns out to be somebody else.
#
# Confirm any future mapping the same way, and record who confirmed it and when.
