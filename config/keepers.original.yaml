# Keeper manifest — EXPECTED STATE, not ledger truth (see §2 of the charter).
# Retention price = floor(0.75 * sleeper_auction_value). Prices are DERIVED by
# the tool at Sprint 0, then reconciled against what is actually loaded in Sleeper.
#
# player_id MUST be resolved from GET /v1/players/nfl and confirmed by position.
# Do NOT match on name alone — see the name-collision warning below.

league:
  teams: 10
  budget: 200
  keepers_per_team: 2
  retention_rule: "floor(0.75 * sleeper_auction_value)"
  value_snapshot_date: TBD   # must be confirmed with the commissioner

user_team: "Me"   # owner of Josh Allen + Drake London; set roster_id at Sprint 0

